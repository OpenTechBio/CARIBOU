<div class="bubble" [class.user]="message.role === 'user'" [class.assistant]="message.role === 'assistant'" [class.streaming]="streaming">
  <div class="bubble-meta">
    <span class="role-label">{{ message.role === 'user' ? 'You' : message.agent_name || 'Agent' }}</span>
    <span class="timestamp" *ngIf="message.timestamp && !streaming">
      {{ message.timestamp | date:'HH:mm:ss' }}
    </span>
    <span class="streaming-cursor" *ngIf="streaming">▌</span>
  </div>
  @if (streaming) {
    <div class="bubble-content md-body streaming-text">{{ message.content }}</div>
  } @else {
    <div class="bubble-content md-body" [innerHTML]="message.content | markdown"></div>
  }
</div>
